<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Required for the set-viewport --mobile asserts to mean anything. Mobile
       emulation only honours the requested width for a page that opts in; a
       page without this tag lays out at Chrome's 980px mobile default, exactly
       as it would on a real phone. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Khora QA Fixture</title>
</head>
<body>
  <h1 id="heading">Khora Test Page</h1>

  <!-- text + attribute tests -->
  <p id="greeting" data-testid="hello" data-role="primary">Hello, Khora!</p>

  <!-- type test -->
  <input id="name-input" type="text" placeholder="Enter name" />

  <!-- type test: React-style controlled input value tracking. React shadows
       the native value setter on the instance to detect real changes; a
       plain `el.value = x` assignment updates its tracker too, so onChange
       never fires. Only a set through the *native* prototype setter (typing
       from a real user, or the native-setter trick) is detected. -->
  <input id="react-input" type="text" placeholder="Enter name" />
  <div id="react-input-result">onchange:0</div>

  <!-- click + console test -->
  <button id="counter-btn">Clicked 0</button>

  <!-- wait-for: appends element to DOM after delay -->
  <button id="show-btn">Show Delayed</button>
  <div id="appear-target"></div>

  <!-- wait-gone: removes element from DOM after delay -->
  <button id="hide-btn">Hide Delayed</button>
  <div id="vanish-target"><span id="ephemeral">I will vanish</span></div>

  <!-- network test: triggers a fetch and XHR -->
  <button id="network-btn">Fire Requests</button>

  <!-- drag test: records trusted press-move-release path -->
  <div id="drag-zone" style="width: 300px; height: 120px; border: 1px solid #888;">Drag here</div>
  <div id="drag-result"></div>

  <!-- drag test: setPointerCapture-guarded handler (splitter pattern) -->
  <div id="splitter" style="width: 300px; height: 40px; border: 1px solid #888;">Splitter</div>
  <div id="splitter-result"></div>

  <!-- click-at/dblclick-at test: records trusted point clicks -->
  <div id="point-target" style="width: 120px; height: 60px; border: 1px solid #888;">Point target</div>
  <div id="point-click-result"></div>

  <!-- key test: records trusted key events with modifier state -->
  <div id="key-result"></div>

  <!-- type-keys test: xterm.js-style hidden textarea. Only reacts to real
       keypress events (type-keys' trusted CDP char dispatch); `type`'s
       JS value-assignment + input/change events have no listener here, so
       it silently no-ops, matching the real xterm.js bug this guards. -->
  <textarea id="term-input" style="position: absolute; left: -9999px; top: 0; width: 0; height: 0;"></textarea>
  <div id="term-result"></div>

  <!-- keyCode test (mesa task 553): xterm.js dispatches off `keyCode`, not
       `key`, so a character whose virtual-key code lands in the navigation
       range is delivered as an escape sequence instead of itself. This
       widget decodes exactly like a terminal does. -->
  <textarea id="vk-input" style="position: absolute; left: -9999px; top: 0; width: 0; height: 0;"></textarea>
  <div id="vk-result"></div>

  <!-- focus/blur test: `document.hasFocus()` is false in headless Chrome, so
       the JS `el.focus()` that `type` performs moves `activeElement` without
       the browser dispatching any focus event — and a later `blur()` then
       dispatches nothing either. Commit-on-blur / validate-on-blur handlers
       never run, while the DOM value (and even React state) reads back
       correctly, which is why this misreads as an app bug. `type-keys` drives
       the real input pipeline, which does produce focus and blur. -->
  <input id="focus-input" type="text" />
  <!-- Next in the tab order after #focus-input, so the suite can tell `blur`
       apart from `key Tab`: both blur the field, but only Tab also focuses
       this one and fires whatever handlers it owns. -->
  <input id="focus-next" type="text" />
  <div id="focus-result">events:</div>

  <!-- wheel test: native scroll + scroll-chaining (overscroll-behavior:contain).
       scrollTop itself is read directly via `eval` — real scrolling needs no
       JS listener to occur, only a native-trusted wheel event to drive it. -->
  <div id="scroll-outer" style="width: 200px; height: 150px; overflow-y: auto;">
    <div id="scroll-inner" style="width: 100%; height: 60px; overflow-y: auto; overscroll-behavior: contain;">
      <div style="height: 600px;">Inner scroll content</div>
    </div>
    <div style="height: 600px;">Outer scroll content below inner</div>
  </div>
  <div id="wheel-result"></div>

  <!-- touch tests. The pan-y/pan-x pair is a differential: an identical
       vertical swipe must scroll the first and leave the second at 0, which
       is what proves Chromium is honoring `touch-action` rather than khora
       merely moving pixels. `touch-action` governs TOUCH panning only, so
       neither box is reachable by a trusted wheel. -->
  <div id="touch-pany" style="width: 200px; height: 150px; overflow-y: auto; touch-action: pan-y;">
    <div style="height: 1200px;">pan-y content</div>
  </div>
  <div id="touch-panx" style="width: 200px; height: 150px; overflow-y: auto; touch-action: pan-x;">
    <div style="height: 1200px;">pan-x content</div>
  </div>

  <!-- tap / long-press targets: record the touch and pointer sequence so a
       tap can be told apart from a click, and a held touch from a tap. -->
  <div id="touch-target" style="width: 200px; height: 100px; background: #eef; touch-action: none;">
    tap me
  </div>
  <div id="touch-result"></div>
  <div id="longpress-result">longpress: no</div>

  <!-- touch-emulation target: its handler is registered ONLY behind load-time
       feature detection, so a trusted tap reaches it only when the device
       reported touch at document creation. -->
  <div id="touch-gate" style="width: 200px; height: 100px; background: #efe; touch-action: none;">
    gated tap
  </div>
  <div id="touch-gate-result">gated: no</div>

  <!-- find multiple elements -->
  <ul id="items">
    <li class="item">Alpha</li>
    <li class="item">Beta</li>
    <li class="item">Gamma</li>
  </ul>

  <script>
    // Counter: click increments text and logs to console
    var counter = 0;
    document.getElementById('counter-btn').addEventListener('click', function() {
      counter++;
      document.getElementById('counter-btn').textContent = 'Clicked ' + counter;
      console.log('counter:' + counter);
    });

    // Append a new element after 500ms (for wait-for)
    document.getElementById('show-btn').addEventListener('click', function() {
      setTimeout(function() {
        var el = document.createElement('div');
        el.id = 'appeared';
        el.textContent = 'I appeared!';
        document.getElementById('appear-target').appendChild(el);
      }, 500);
    });

    // Remove element from DOM after 500ms (for wait-gone)
    document.getElementById('hide-btn').addEventListener('click', function() {
      setTimeout(function() {
        var el = document.getElementById('ephemeral');
        if (el) el.parentNode.removeChild(el);
      }, 500);
    });

    // Network test: fetch + XHR using blob URLs (works on file://)
    document.getElementById('network-btn').addEventListener('click', function() {
      var blob = new Blob(['ok'], {type: 'text/plain'});
      var url = URL.createObjectURL(blob);
      fetch(url).then(function() { console.log('fetch-done'); });

      var xhr = new XMLHttpRequest();
      xhr.open('POST', url);
      xhr.addEventListener('load', function() { console.log('xhr-done'); });
      xhr.send('test');
    });

    // Drag test: record press point, move count, and trusted release point
    var dragging = false, dragMoves = 0, dragStart = '';
    document.getElementById('drag-zone').addEventListener('mousedown', function(e) {
      dragging = true;
      dragMoves = 0;
      dragStart = Math.round(e.clientX) + ',' + Math.round(e.clientY);
    });
    document.addEventListener('mousemove', function() {
      if (dragging) dragMoves++;
    });
    document.addEventListener('mouseup', function(e) {
      if (!dragging) return;
      dragging = false;
      document.getElementById('drag-result').textContent =
        'drag:' + dragStart + '->' + Math.round(e.clientX) + ',' + Math.round(e.clientY) +
        ' moves:' + dragMoves + ' trusted:' + e.isTrusted;
    });

    // Splitter drag: only moves while the element holds pointer capture,
    // like real splitter/slider widgets. Untrusted synthetic pointer events
    // never satisfy hasPointerCapture, so only trusted input can drive this.
    var splitter = document.getElementById('splitter');
    var capMoves = 0, capStart = '';
    splitter.addEventListener('pointerdown', function(e) {
      splitter.setPointerCapture(e.pointerId);
      capMoves = 0;
      capStart = Math.round(e.clientX) + ',' + Math.round(e.clientY);
    });
    splitter.addEventListener('pointermove', function(e) {
      if (splitter.hasPointerCapture(e.pointerId)) capMoves++;
    });
    splitter.addEventListener('pointerup', function(e) {
      var captured = splitter.hasPointerCapture(e.pointerId);
      splitter.releasePointerCapture(e.pointerId);
      document.getElementById('splitter-result').textContent =
        'capdrag:' + capStart + '->' + Math.round(e.clientX) + ',' + Math.round(e.clientY) +
        ' capmoves:' + capMoves + ' captured:' + captured + ' trusted:' + e.isTrusted;
    });

    // click-at/dblclick-at test: record trusted click/dblclick at a point,
    // including native click-count semantics (dblclick only fires when the
    // second press/release pair carries clickCount 2).
    var pointTarget = document.getElementById('point-target');
    var pointClicks = 0, pointDblclicks = 0;
    pointTarget.addEventListener('click', function(e) {
      pointClicks++;
      document.getElementById('point-click-result').textContent =
        'click:' + pointClicks + ' at:' + Math.round(e.clientX) + ',' + Math.round(e.clientY) +
        ' trusted:' + e.isTrusted;
    });
    pointTarget.addEventListener('dblclick', function(e) {
      pointDblclicks++;
      document.getElementById('point-click-result').textContent =
        'dblclick:' + pointDblclicks + ' at:' + Math.round(e.clientX) + ',' + Math.round(e.clientY) +
        ' trusted:' + e.isTrusted;
    });

    // Key test: record key/code, modifier flags, and trusted state.
    // Listens document-wide, like a real page-level keyboard shortcut.
    document.addEventListener('keydown', function(e) {
      document.getElementById('key-result').textContent =
        'key:' + e.key + ' code:' + e.code +
        ' meta:' + e.metaKey + ' ctrl:' + e.ctrlKey +
        ' shift:' + e.shiftKey + ' alt:' + e.altKey +
        ' trusted:' + e.isTrusted;
    });

    // type-keys test: xterm.js-style widget — only accumulates characters
    // from real keypress events (never reads the textarea's .value), so it
    // proves type-keys' trusted per-char dispatch where `type` would no-op.
    (function() {
      var term = document.getElementById('term-input');
      var buf = '';
      term.addEventListener('keypress', function(e) {
        buf += e.key;
        document.getElementById('term-result').textContent =
          'typed:' + buf + ' trusted:' + e.isTrusted;
      });
    })();

    // type-keys keyCode test (mesa task 553): a terminal emulator decides
    // what to send from `keyCode`, falling back to `key` only for codes it
    // does not claim. Pre-fix, char_key_info reported the character's
    // codepoint as its virtual key, so '-' (U+002D = 45 = VK_INSERT) reached
    // xterm.js as Insert and a real shell received ESC[2~ in its place.
    (function() {
      var NAV = {
        8: 'BS', 9: 'Tab', 13: 'Enter', 27: 'Esc', 33: 'PageUp',
        34: 'PageDown', 35: 'End', 36: 'Home', 37: 'Left', 38: 'Up',
        39: 'Right', 40: 'Down', 45: 'Insert', 46: 'Delete',
        112: 'F1', 122: 'F11', 123: 'F12'
      };
      var buf = '';
      document.getElementById('vk-input').addEventListener('keydown', function(e) {
        buf += NAV[e.keyCode] ? '<' + NAV[e.keyCode] + '>' : e.key;
        document.getElementById('vk-result').textContent = 'sent:' + buf;
      });
    })();

    // Wheel test: record trusted state of the native wheel event dispatched
    // at the inner scroll container.
    document.getElementById('scroll-inner').addEventListener('wheel', function(e) {
      document.getElementById('wheel-result').textContent = 'wheel trusted:' + e.isTrusted;
    });

    // Touch tests: record the touch/pointer sequence a tap produces, so a
    // trusted tap can be distinguished from a trusted click (which fires no
    // TouchEvent at all and reports pointerType 'mouse').
    (function() {
      var target = document.getElementById('touch-target');
      var seen = [];
      var pointerType = '';
      ['touchstart', 'touchend'].forEach(function(t) {
        target.addEventListener(t, function(e) {
          seen.push(t + ':' + e.isTrusted);
          document.getElementById('touch-result').textContent = 'touch:' + seen.join(',');
        }, { passive: true });
      });
      target.addEventListener('pointerdown', function(e) {
        pointerType = e.pointerType;
        document.getElementById('touch-result').dataset.pointerType = pointerType;
      });

      // Long-press: a timer armed on touchstart that an early touchend
      // cancels — the same shape drag-activation delays and context menus
      // use, so it only reports yes if the hold was a real wait.
      var timer = null;
      target.addEventListener('touchstart', function() {
        timer = setTimeout(function() {
          document.getElementById('longpress-result').textContent = 'longpress: yes';
        }, 400);
      }, { passive: true });
      target.addEventListener('touchend', function() {
        clearTimeout(timer);
      }, { passive: true });
    })();

    // React-style value tracking: shadow the native setter on the instance,
    // and only report a change when the underlying native value diverges
    // from what the tracker last saw (i.e. the native setter was used
    // directly, bypassing this instance's shadowed setter).
    (function() {
      var input = document.getElementById('react-input');
      var descriptor = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value');
      var nativeGet = descriptor.get, nativeSet = descriptor.set;
      var trackedValue = nativeGet.call(input);

      Object.defineProperty(input, 'value', {
        get: function() { return nativeGet.call(this); },
        set: function(v) {
          trackedValue = v;
          nativeSet.call(this, v);
        },
        configurable: true
      });

      var onChangeCount = 0;
      input.addEventListener('input', function() {
        var current = nativeGet.call(input);
        if (current !== trackedValue) {
          trackedValue = current;
          onChangeCount++;
          document.getElementById('react-input-result').textContent =
            'onchange:' + onChangeCount + ' value:' + current;
        }
      });
    })();

    // Focus/blur tracking: records every focus and blur the browser actually
    // dispatches, so the e2e suite can assert that `type` produces none of
    // them while `type-keys` produces both.
    (function() {
      var el = document.getElementById('focus-input');
      var out = document.getElementById('focus-result');
      ['focus', 'blur'].forEach(function(t) {
        el.addEventListener(t, function() {
          out.textContent += t + ',';
        });
      });
      // Stands in for the "unrelated handler" a Tab-as-blur fires by landing
      // focus on the next element; `blur` must leave it silent.
      document.getElementById('focus-next').addEventListener('focus', function() {
        out.textContent += 'next-focus,';
      });
    })();

    // Load-time touch feature detection, recorded as it stood when this
    // document was created. `'ontouchstart' in window` is fixed at that point
    // and cannot be moved afterwards, which is why `emulate-touch` has to run
    // before the navigation rather than after it.
    (function() {
      window.__touchDetect = {
        ontouchstart: 'ontouchstart' in window,
        maxTouchPoints: navigator.maxTouchPoints,
        coarse: matchMedia('(pointer: coarse)').matches
      };
      // The failure mode the command exists for: an app that attaches touch
      // handlers only behind the check has none for a trusted tap to reach.
      if (window.__touchDetect.ontouchstart) {
        document.getElementById('touch-gate').addEventListener('touchstart', function(e) {
          document.getElementById('touch-gate-result').textContent = 'gated: ' + e.isTrusted;
        });
      }
    })();

    // Eval test value
    window.khoraTestValue = 42;
  </script>
</body>
</html>
